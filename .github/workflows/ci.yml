name: HomeSphere CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (.NET 8 Clean Monolith)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore HomeSphere.sln

      - name: Build Solution (Release)
        run: dotnet build HomeSphere.sln -c Release --no-restore

      - name: Execute Automated Unit Tests & Coverage
        run: dotnet test HomeSphere.sln -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  frontend-ci:
    name: Frontend (Next.js 16 + PPR + Turbopack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install NPM Dependencies (Clean Install)
        run: npm ci

      - name: Next.js Production Build (with Standalone Output)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5100
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
